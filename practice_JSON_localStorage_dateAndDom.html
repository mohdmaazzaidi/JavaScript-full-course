<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
        }
        #my-button {
            height: 50px;
            width: 50px;
            border: none;
            border-radius: 20px;
            font-size: larger;
        }
        .js-odd{
            background-color: blueviolet;
        }
        .js-even{
            background-color: rgb(239, 215, 39);
        }
    </style>
</head>

<body>
    <h3 id="greeting"></h3>
    <button id="my-button" onclick="buttonPressed();" ></button>



    <script>
        let clickCount = localStorage.getItem('clickCount') || 0;
        function buttonPressed(){
            console.log("pressed");
            clickCount++;
            localStorage.setItem('clickCount',clickCount);
            updateButton();
        }

        function updateButton(){
            let button = document.querySelector('#my-button');
            if (clickCount%2 == 0){
                button.classList.remove('js-odd');
                button.classList.add('js-even')
            } else {
                button.classList.remove('js-even');
                button.classList.add('js-odd')
            }
            button.innerText = clickCount;
        }

        updateButton()





        function doGreeting(personName = 'Dear') {
            let date = new Date();
            let hours = date.getHours();
            let heading = document.querySelector('#greeting');
            if (hours > 5 && hours <= 12) {
                heading.innerText = `Good Morning ${personName}`;
            } else if (hours > 12 && hours < 18) {
                heading.innerText = `Good Afternoon ${personName}`;
            } else {
                heading.innerText = `Good night ${personName}`;
            }
        }
        doGreeting('Maaz');

    </script>
</body>

</html>
