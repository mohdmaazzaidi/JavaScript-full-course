<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="button" id="bt1" onclick=" cartQuantity += 1;  document.querySelector('#Cart').innerText = `Your bag has ${cartQuantity} items`; 
        ">Add to bag</button>

    <button class="button" id="bt2"
        onclick=" cartQuantity -= 1;  document.querySelector('#Cart').innerText = `Your bag has ${cartQuantity} items`; ">Move to Wishlist</button>

    <button class="button" id="bt1"
        onclick="cartQuantity += 2;  document.querySelector('#Cart').innerText = `Your bag has ${cartQuantity} items`; ">Add
        1+1 sale item</button>

    <h1 id="Cart"></h1>


    <script>
        let cartQuantity = 0;
        document.querySelector('#Cart').innerText = `Your bag has ${cartQuantity} items`;
    </script>
</body>

</html>
